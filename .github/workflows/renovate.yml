name: Renovate

on:
  schedule:
    # Monday 05:00 UTC is before 08:00 in Europe/Berlin in both summer and winter.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run (no PRs or commits)'
        type: boolean
        default: false
      logLevel:
        description: 'Log level'
        type: choice
        options: [info, debug]
        default: info
  push:
    branches: [main]
    paths:
      - renovate.json
      - .github/workflows/renovate.yml

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A PAT is required so Renovate PRs trigger CI.
      # Fine-grained PAT permissions: Contents, Pull requests, Issues and
      # Workflows: read/write; Dependabot alerts: read (for security updates).
      - name: Check Renovate token
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo "::error::Add the RENOVATE_TOKEN Actions secret with access to this repository. GITHUB_TOKEN cannot trigger CI for Renovate PRs."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.9
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_GIT_AUTHOR: "Renovate Bot <180746461+AudioInj@users.noreply.github.com>"
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || 'null' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
